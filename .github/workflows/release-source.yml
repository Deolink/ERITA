name: Release Windows and Linux patcher

on:
  push:
    tags:
      - "v0.9.7"

permissions: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: patcher/requirements-win64.lock

      - name: Verify pinned official Python bootstrap
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $url = "https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe"
          $expectedHash = "edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403"
          $expectedPublisher = "CN=Python Software Foundation, O=Python Software Foundation, L=Beaverton, S=Oregon, C=US"
          $manifestUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/9a9e78cfec415bd294cced116b786562a9c32017/manifests/p/Python/Python/3/13/3.13.15/Python.Python.3.13.installer.yaml"
          $manifest = Join-Path $env:RUNNER_TEMP "Python.Python.3.13.installer.yaml"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $manifest $manifestUrl
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          if ($manifestHash -ne "7fe6aab138453720882711688ffb220f9fd81a42c56bfe7d4a10939e6de052c2") {
            throw "Manifesto WinGet fixado divergiu"
          }
          $metadata = Get-Content -LiteralPath $manifest -Raw
          foreach ($expected in @($url, $expectedHash)) {
            if ($metadata.IndexOf($expected, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "Manifesto WinGet nao contem $expected"
            }
          }
          $installer = Join-Path $env:RUNNER_TEMP "python-3.13.15-amd64-verification.exe"
          & "$env:SystemRoot\System32\curl.exe" --fail --show-error --proto "=https" --tlsv1.2 --retry 2 --output $installer $url
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -ne 29452944) { throw "Tamanho do instalador Python divergiu" }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "SHA-256 do instalador Python divergiu" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -ne $expectedPublisher) {
            throw "Assinatura ou publicador do instalador Python divergiu"
          }

      - name: Validate release version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $expected = "v" + (python -c "import patcher; print(patcher.__version__)")
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} nao corresponde ao codigo $expected"
          }

      - name: Install and test locked environment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated install `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            -r patcher/requirements-win64.lock
          python -m pip check
          python -m compileall -q patcher tools
          python -m unittest discover -s tests -v

      - name: Download exact Windows wheels
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip --isolated download `
            --disable-pip-version-check `
            --no-input `
            --require-hashes `
            --only-binary=:all: `
            --dest wheelhouse `
            -r patcher/requirements-win64.lock

      # Pre-requisito de promocao: o asset grande e autenticado precisa existir
      # numa prerelease publicada de staging. Seus arquivos sao incorporados de
      # forma plana; o ZIP de staging nunca e aninhado no release final.
      - name: Download authenticated staging payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $stagingTag = "v0.9.4-rc.1"
          $stagingAsset = "patch_data_v094_rc1_wwise135_v2.zip"
          New-Item -ItemType Directory -Force payload-staging | Out-Null
          try {
            $staging = gh release view $stagingTag `
              --repo "${{ github.repository }}" `
              --json tagName,isDraft,isPrerelease | ConvertFrom-Json
            if ($staging.isDraft -or -not $staging.isPrerelease) {
              throw "A release de origem precisa ser uma prerelease publicada de staging."
            }
            gh release download $stagingTag `
              --repo "${{ github.repository }}" `
              --pattern $stagingAsset `
              --dir payload-staging
          } catch {
            throw "Pre-requisito ausente: publique primeiro o asset de staging $stagingTag/$stagingAsset. $($_.Exception.Message)"
          }
          $payload = Join-Path "payload-staging" $stagingAsset
          if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) {
            throw "Pre-requisito ausente: asset de staging $stagingTag/$stagingAsset"
          }
          $item = Get-Item -LiteralPath $payload
          if ($item.Length -ne 588468447) {
            throw "Tamanho do payload de staging divergiu: $($item.Length)"
          }
          $hash = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "430e9693a9b3313826e9f7c890cf592eb5b468d145bb405e8a4586002b877680") {
            throw "SHA-256 do payload de staging divergiu: $hash"
          }

      - name: Build and verify single final ZIP
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/ERPT-BR-v0.9.7-Windows.zip"
          python tools/build_source_release.py `
            --version "${{ github.ref_name }}" `
            --wheelhouse wheelhouse `
            --payload "payload-staging/patch_data_v094_rc1_wwise135_v2.zip" `
            --output $archive
          python tools/verify_source_release.py $archive
          $item = Get-Item $archive
          $hash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
          "SHA-256: ``$hash``" | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Smoke test the real source installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "$env:SystemRoot\py.exe")) {
            throw "Python Launcher oficial ausente no runner Windows"
          }
          & "$env:SystemRoot\py.exe" -3.13 -I -S -c "import sys; raise SystemExit(sys.version_info[:3] != (3,13,15))"
          if ($LASTEXITCODE -ne 0) { throw "py.exe nao resolveu Python 3.13.15" }
          $archive = "dist/ERPT-BR-v0.9.7-Windows.zip"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "erptbr-source-install-smoke"
          $smokeProfile = Join-Path $env:RUNNER_TEMP "erptbr-source-profile"
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot
          $packageRoot = Get-ChildItem -LiteralPath $smokeRoot -Directory | Select-Object -First 1
          $env:LOCALAPPDATA = $smokeProfile
          $env:ERPTBR_NONINTERACTIVE = "1"
          $env:ERPTBR_INSTALL_ONLY = "1"
          & (Join-Path $packageRoot.FullName "ERPT-BR.cmd")
          if ($LASTEXITCODE -ne 0) { throw "Smoke test real de ERPT-BR.cmd falhou" }
          $venvPython = Join-Path $smokeProfile "ERPT-BR\venv-0.9.7\Scripts\python.exe"
          $venvSite = Join-Path $smokeProfile "ERPT-BR\venv-0.9.7\Lib\site-packages"
          $sourceRoot = $packageRoot.FullName
          & $venvPython -I -S -c "import struct,sys,sysconfig; sys.path.extend((sys.argv[1],sys.argv[2])); import patcher.patcher_gui,tkinter,customtkinter; from Crypto.Cipher import AES; raise SystemExit(0 if sys.version_info[:3] == (3,13,15) and struct.calcsize('P') == 8 and sysconfig.get_platform().lower() == 'win-amd64' else 1)" $sourceRoot $venvSite
          if ($LASTEXITCODE -ne 0) { throw "Smoke test isolado do ambiente instalado falhou" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erpt-br-v0.9.7-windows
          path: dist/ERPT-BR-v0.9.7-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: patcher/requirements-linux-x86_64.lock

      - name: Validate release version
        run: |
          set -Eeuo pipefail
          expected="v$(python -c 'import patcher; print(patcher.__version__)')"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Install and test hash-locked Linux environment
        run: |
          set -Eeuo pipefail
          python -m pip --isolated install \
            --disable-pip-version-check \
            --no-input \
            --require-hashes \
            --only-binary=:all: \
            -r patcher/requirements-linux-x86_64.lock
          python -m pip check
          bash -n ERPT-BR.sh interno/INICIAR_LINUX.sh
          python -m compileall -q patcher tools
          python -m unittest discover -s tests -v
          python -m unittest -v \
            tests.test_engine.CoreFilesystemPortabilityTests \
            tests.test_patch_data.CoreFilesystemPortabilityTests

      - name: Download and authenticate exact Astral runtime
        run: |
          set -Eeuo pipefail
          runtime_name="cpython-3.13.15+20260924-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          runtime_url="https://github.com/astral-sh/python-build-standalone/releases/download/20260924/cpython-3.13.15%2B20260924-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          expected_size="34993852"
          expected_sha256="d0b640eed27fbdd6f5f2bd33444aee53df2c8863f8b2a96f4094717411e3de9c"
          mkdir -p runtime
          curl --fail --show-error --location \
            --proto '=https' --tlsv1.2 --retry 2 \
            --output "runtime/$runtime_name" "$runtime_url"
          actual_size="$(stat -c '%s' "runtime/$runtime_name")"
          actual_sha256="$(sha256sum "runtime/$runtime_name" | cut -d' ' -f1)"
          test "$actual_size" = "$expected_size"
          test "$actual_sha256" = "$expected_sha256"

      - name: Download exact Linux wheels
        run: |
          set -Eeuo pipefail
          python -m pip --isolated download \
            --disable-pip-version-check \
            --no-input \
            --require-hashes \
            --only-binary=:all: \
            --dest wheelhouse \
            -r patcher/requirements-linux-x86_64.lock

      - name: Download authenticated staging payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          staging_tag="v0.9.4-rc.1"
          staging_asset="patch_data_v094_rc1_wwise135_v2.zip"
          mkdir -p payload-staging
          staging_json="$(gh release view "$staging_tag" \
            --repo "${{ github.repository }}" \
            --json tagName,isDraft,isPrerelease)"
          test "$(jq -r '.tagName' <<<"$staging_json")" = "$staging_tag"
          test "$(jq -r '.isDraft' <<<"$staging_json")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$staging_json")" = "true"
          gh release download "$staging_tag" \
            --repo "${{ github.repository }}" \
            --pattern "$staging_asset" \
            --dir payload-staging
          payload="payload-staging/$staging_asset"
          test -f "$payload"
          test "$(stat -c '%s' "$payload")" = "588468447"
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = \
            "430e9693a9b3313826e9f7c890cf592eb5b468d145bb405e8a4586002b877680"

      - name: Build and verify final Linux archive
        run: |
          set -Eeuo pipefail
          runtime_name="cpython-3.13.15+20260924-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          archive="dist/ERPT-BR-v0.9.7-Linux-x86_64.tar.gz"
          mkdir -p dist
          python tools/build_linux_release.py \
            --version "$GITHUB_REF_NAME" \
            --wheelhouse wheelhouse \
            --runtime "runtime/$runtime_name" \
            --payload "payload-staging/patch_data_v094_rc1_wwise135_v2.zip" \
            --output "$archive"
          python tools/verify_linux_release.py "$archive"
          hash="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf 'SHA-256: `%s`\n' "$hash" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test extracted portable Linux package
        run: |
          set -Eeuo pipefail
          archive="dist/ERPT-BR-v0.9.7-Linux-x86_64.tar.gz"
          smoke_root="$RUNNER_TEMP/erptbr-linux-smoke"
          smoke_home="$RUNNER_TEMP/erptbr-linux-home"
          xdg_data="$RUNNER_TEMP/erptbr-linux-data"
          xdg_state="$RUNNER_TEMP/erptbr-linux-state"
          xdg_cache="$RUNNER_TEMP/erptbr-linux-cache"
          mkdir -p "$smoke_root" "$smoke_home" "$xdg_data" "$xdg_state" "$xdg_cache"
          tar --extract --gzip --file "$archive" --directory "$smoke_root" \
            --no-same-owner --no-same-permissions
          mapfile -t package_roots < <(find "$smoke_root" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#package_roots[@]}" = "1"
          package_root="${package_roots[0]}"
          test -x "$package_root/ERPT-BR.sh"
          test -x "$package_root/interno/INICIAR_LINUX.sh"
          HOME="$smoke_home" \
          XDG_DATA_HOME="$xdg_data" \
          XDG_STATE_HOME="$xdg_state" \
          XDG_CACHE_HOME="$xdg_cache" \
          ERPTBR_INSTALL_ONLY=1 \
            bash "$package_root/ERPT-BR.sh"

          runtime_python="$xdg_data/ERPT-BR/runtime-cpython-3.13.15-20260924/bin/python3.13"
          deps_root="$xdg_data/ERPT-BR/deps-0.9.7-linux-x86_64"
          test -x "$runtime_python"
          "$runtime_python" -I -S -c \
            "import struct,sys,sysconfig; sys.path.extend((sys.argv[1],sys.argv[2])); import patcher.patcher_gui,tkinter,customtkinter; from Crypto.Cipher import AES; raise SystemExit(0 if sys.version_info[:3] == (3,13,15) and struct.calcsize('P') == 8 and sysconfig.get_platform() == 'linux-x86_64' else 1)" \
            "$package_root" "$deps_root"

          if command -v xvfb-run >/dev/null 2>&1 && \
             command -v Xvfb >/dev/null 2>&1 && \
             command -v xauth >/dev/null 2>&1; then
            HOME="$smoke_home" \
            XDG_DATA_HOME="$xdg_data" \
            XDG_STATE_HOME="$xdg_state" \
            XDG_CACHE_HOME="$xdg_cache" \
            ERPTBR_GUI_SMOKE=1 \
              xvfb-run -a "$runtime_python" -I -S -c \
              "import runpy,sys; sys.path.extend((sys.argv[1],sys.argv[2])); runpy.run_module('patcher.patcher_gui',run_name='__main__')" \
              "$package_root" "$deps_root"
          else
            echo "::notice::xvfb-run nao esta disponivel neste runner; smoke GUI ignorado."
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erpt-br-v0.9.7-linux-x86-64
          path: dist/ERPT-BR-v0.9.7-Linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: erpt-br-v0.9.7-windows
          path: dist

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: erpt-br-v0.9.7-linux-x86-64
          path: dist

      - name: Attest immutable Windows artifact
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/ERPT-BR-v0.9.7-Windows.zip

      - name: Attest immutable Linux artifact
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/ERPT-BR-v0.9.7-Linux-x86_64.tar.gz

      - name: Publish new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          windows_name="ERPT-BR-v0.9.7-Windows.zip"
          linux_name="ERPT-BR-v0.9.7-Linux-x86_64.tar.gz"
          windows_archive="dist/$windows_name"
          linux_archive="dist/$linux_name"
          notes="docs/RELEASE-0.9.7.md"
          tag="v0.9.7"
          title="ERPT-BR v0.9.7 — Suporte inicial a Linux e Steam Deck"
          test -f "$windows_archive"
          test -f "$linux_archive"
          test -f "$notes"

          declare -A archive_by_name=(
            ["$windows_name"]="$windows_archive"
            ["$linux_name"]="$linux_archive"
          )
          declare -A type_by_name=(
            ["$windows_name"]="application/zip"
            ["$linux_name"]="application/gzip"
          )
          declare -A size_by_name digest_by_name
          for name in "$windows_name" "$linux_name"; do
            archive="${archive_by_name[$name]}"
            size_by_name["$name"]="$(wc -c < "$archive" | tr -d '[:space:]')"
            digest_by_name["$name"]="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          done

          # Confirma que a ref exata da tag existe antes de criar o draft.
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent

          # O endpoint /releases/tags nao retorna drafts de forma confiavel.
          # Liste releases autenticadas e reutilize somente uma release exata,
          # tornando uma nova execucao segura sem sobrescrever nenhum asset.
          releases="$RUNNER_TEMP/erptbr-releases.json"
          gh api "repos/${{ github.repository }}/releases?per_page=100" > "$releases"
          existing_count="$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases")"
          if [ "$existing_count" = "0" ]; then
            create_request="$RUNNER_TEMP/erptbr-v097-create.json"
            create_response="$RUNNER_TEMP/erptbr-v097-release.json"
            jq -n \
              --arg tag "$tag" \
              --arg title "$title" \
              --rawfile body "$notes" \
              '{tag_name:$tag, name:$title, body:$body, draft:true, prerelease:false, make_latest:"false"}' \
              > "$create_request"
            gh api --method POST \
              "repos/${{ github.repository }}/releases" \
              --input "$create_request" > "$create_response"
            release_id="$(jq -r '.id' "$create_response")"
            release_was_draft="true"
          elif [ "$existing_count" = "1" ]; then
            if ! jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              --rawfile body "$notes" \
              '.[] | select(.tag_name == $tag and .prerelease == false and .name == $title and .body == $body)' \
              "$releases" > /dev/null; then
              echo "A release existente nao corresponde exatamente ao release esperado." >&2
              exit 1
            fi
            release_id="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' "$releases")"
            release_was_draft="$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .draft' "$releases")"
          else
            echo "Mais de uma release usa a tag $tag." >&2
            exit 1
          fi
          test -n "$release_id"
          upload_template="$(gh api "repos/${{ github.repository }}/releases/${release_id}" --jq '.upload_url')"
          upload_url="$(printf '%s' "$upload_template" | sed 's/{.*$//')"
          test -n "$upload_url"

          # A release permanece em rascunho ate que nome, MIME, tamanho,
          # digest e estado dos dois assets tenham sido confirmados.
          assets="$RUNNER_TEMP/erptbr-v097-assets.json"
          gh api "repos/${{ github.repository }}/releases/${release_id}/assets" > "$assets"

          unexpected_count="$(jq \
            --arg windows "$windows_name" \
            --arg linux "$linux_name" \
            '[.[] | select(.name != $windows and .name != $linux)] | length' \
            "$assets")"
          if [ "$unexpected_count" != "0" ]; then
            echo "A release contem asset inesperado; nenhum arquivo sera sobrescrito." >&2
            exit 1
          fi

          starter_count="$(jq \
            --arg windows "$windows_name" \
            --arg linux "$linux_name" \
            '[.[] | select((.name == $windows or .name == $linux) and .state == "starter")] | length' \
            "$assets")"
          if [ "$starter_count" != "0" ]; then
            test "$release_was_draft" = "true"
            while IFS= read -r stale_id; do
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/${stale_id}"
            done < <(jq -r \
              --arg windows "$windows_name" \
              --arg linux "$linux_name" \
              '.[] | select((.name == $windows or .name == $linux) and .state == "starter") | .id' \
              "$assets")
            gh api "repos/${{ github.repository }}/releases/${release_id}/assets" > "$assets"
          fi

          for name in "$windows_name" "$linux_name"; do
            matching="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' "$assets")"
            if [ "$matching" = "0" ]; then
              test "$release_was_draft" = "true"
              archive="${archive_by_name[$name]}"
              content_type="${type_by_name[$name]}"
              response="$RUNNER_TEMP/erptbr-v097-${name}.upload.json"
              curl --fail-with-body --silent --show-error \
                --proto '=https' --tlsv1.2 \
                --request POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: $content_type" \
                --data-binary "@$archive" \
                --output "$response" \
                "${upload_url}?name=${name}"
            elif [ "$matching" != "1" ]; then
              echo "Mais de um asset usa o nome $name." >&2
              exit 1
            fi
          done

          # O digest pode aparecer alguns segundos depois do upload. A espera
          # e limitada e a publicacao falha fechada se ele nao ficar pronto.
          for attempt in $(seq 1 12); do
            gh api "repos/${{ github.repository }}/releases/${release_id}/assets" > "$assets"
            ready="$(jq \
              --arg windows "$windows_name" \
              --arg linux "$linux_name" \
              '[.[] | select(.name == $windows or .name == $linux)]
               | length == 2 and all(.state == "uploaded" and ((.digest // "") | startswith("sha256:")))' \
              "$assets")"
            if [ "$ready" = "true" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "Os dois assets nao ficaram autenticados a tempo." >&2
              exit 1
            fi
            sleep 5
          done

          test "$(jq 'length' "$assets")" = "2"
          for name in "$windows_name" "$linux_name"; do
            matching="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' "$assets")"
            test "$matching" = "1"
            asset_type="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .content_type' "$assets")"
            asset_size="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .size' "$assets")"
            asset_digest="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' "$assets")"
            asset_state="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .state' "$assets")"
            test "$asset_type" = "${type_by_name[$name]}"
            test "$asset_size" = "${size_by_name[$name]}"
            test "$asset_digest" = "${digest_by_name[$name]}"
            test "$asset_state" = "uploaded"
          done

          publish_request="$RUNNER_TEMP/erptbr-v097-publish.json"
          publish_response="$RUNNER_TEMP/erptbr-v097-published.json"
          jq -n '{draft:false, make_latest:"true"}' > "$publish_request"
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${release_id}" \
            --input "$publish_request" > "$publish_response"
          test "$(jq -r '.draft' "$publish_response")" = "false"
          test "$(jq -r '.tag_name' "$publish_response")" = "$tag"
          test "$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')" = "$tag"
